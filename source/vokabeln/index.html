<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vokabeln · 三语生词本</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#25332e;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1080px;margin:auto;padding:40px 24px}a{color:#356b57}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:clamp(32px,6vw,52px);letter-spacing:-2px;margin:30px 0 8px}p{line-height:1.7;color:#65726b}.label{font-size:12px;letter-spacing:2px;color:#65726b}label{display:block;margin:30px 0 10px}input{width:100%;padding:17px 20px;border:1px solid #c7d2ca;border-radius:12px;background:white;color:#25332e;font:inherit}input:focus{outline:3px solid #a5cbb8;outline-offset:2px}.table-wrap{overflow-x:auto;background:white;border:1px solid #dce2db;border-radius:14px}table{border-collapse:collapse;width:100%;text-align:left}th{font-size:13px;color:#52675a;background:#edf1eb}th,td{padding:18px 20px;border-bottom:1px solid #e7ebe5;vertical-align:top}td:first-child{font-weight:600}small{display:block;color:#65726b;font-weight:400;margin-top:8px}#empty{text-align:center;padding:50px 20px}footer{font-size:13px;margin-top:28px;color:#65726b}@media(max-width:600px){main{padding:24px 16px}th,td{padding:14px 12px}header{align-items:flex-start}}
  </style>
</head>
<body><main>
  <header><span class="label">SPANISCH / 学习笔记</span><a href="/">返回博客</a></header>
  <h1>Vokabeln</h1>
  <p>西班牙语 · Deutsch · 中文<br>把新遇到的词放在这里，慢慢积累。</p>
  <label for="search">搜索单词、释义、课次或例句</label>
  <input id="search" type="search" placeholder="输入西语、德语或中文…" autocomplete="off" aria-controls="words">
  <p id="count" role="status" aria-live="polite">正在读取生词…</p>
  <div class="table-wrap"><table id="words"><thead><tr><th scope="col">Español</th><th scope="col">Deutsch</th><th scope="col">中文</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden></div></div>
  <footer>支持忽略大小写和重音符号搜索。生词按西班牙语字母排序。</footer>
</main>
<script>
  const input=document.getElementById('search'),rows=document.getElementById('rows'),empty=document.getElementById('empty'),count=document.getElementById('count');
  let words=[];
  const normalize=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase().replace(/ß/g,'ss');
  function render(){
    const terms=normalize(input.value).trim().split(/\s+/).filter(Boolean);
    const matches=words.filter(word=>terms.every(term=>normalize([word.es,word.de,word.zh,word.lesson,word.example].join(' ')).includes(term)));
    rows.replaceChildren();
    for(const word of matches){const row=document.createElement('tr');for(const key of ['es','de','zh']){const cell=document.createElement('td');cell.textContent=word[key]||'—';if(key==='es'){for(const detail of [word.lesson,word.example]){if(detail){const note=document.createElement('small');note.textContent=detail;cell.append(note)}}}row.append(cell)}rows.append(row)}
    count.textContent=terms.length?`找到 ${matches.length} / ${words.length} 个词条`:`共 ${words.length} 个词条`;
    empty.hidden=matches.length>0;empty.textContent=words.length?'没有找到匹配的词条，试试其他拼写。':'生词本还是空的，留给你的第一个词。';
  }
  input.addEventListener('input',render);
  fetch('./words.json').then(response=>{if(!response.ok)throw new Error('load');return response.json()}).then(data=>{if(!Array.isArray(data))throw new Error('format');words=data.sort((a,b)=>String(a.es||'').localeCompare(String(b.es||''),'es'));render()}).catch(()=>{count.textContent='暂时无法读取生词';empty.hidden=false;empty.textContent='请刷新重试。'});
</script></body></html>
